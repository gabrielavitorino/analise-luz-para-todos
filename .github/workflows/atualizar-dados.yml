name: Atualizar dados

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 10 * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run_pipeline.py
      - name: Commit dos dados processados e gráficos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed docs/images data/raw/manifest.json
          git diff --cached --quiet || git commit -m "chore: atualizar dados públicos"
          git push
